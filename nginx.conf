# nginx del frontend (contenedor "frontend", puerto 80)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS interno de Docker: resuelve "bff" al momento de cada request
    # (nginx arranca aunque el BFF aún no esté listo).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /api/* -> BFF. En AWS, API Gateway envía /api/* directo al BFF (con validación JWT);
    # este proxy permite probar todo en local en http://localhost con el mismo dominio.
    location /api/ {
        set $bff http://bff:8080;
        proxy_pass $bff;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con hash (Vite): caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta de React (/paciente, /admin/usuarios...) devuelve index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
